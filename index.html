<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Mapa de Clientes · Acceso Seguro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<style>
:root {
  --bg:       #070E1A;
  --panel:    #0B1525;
  --panel2:   #0F1C30;
  --border:   rgba(255,255,255,.07);
  --gold:     #C9A227;
  --gold-dim: rgba(201,162,39,.14);
  --gold-ring:rgba(201,162,39,.35);
  --teal:     #2DD4BF;
  --purple:   #818CF8;
  --red:      #EF4444;
  --green:    #22C55E;
  --blue:     #38BDF8;
  --text:     #E2E8F0;
  --sub:      #94A3B8;
  --muted:    #4B5563;
  --r:        11px;
  --shadow:   0 0 0 1px var(--border), 0 20px 40px rgba(0,0,0,.65);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; height: 100dvh; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, 'Inter', BlinkMacSystemFont, 'Segoe UI', sans-serif;
  -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
}

#map { position: absolute; inset: 0; z-index: 1; }

/* MODAL DE LOGIN BLOQUEANTE */
#login-overlay {
  position: fixed; inset: 0; background: rgba(7,14,26,.97); backdrop-filter: blur(12px);
  z-index: 3000; display: flex; align-items: center; justify-content: center; padding: 16px;
}
#login-card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
  box-shadow: var(--shadow); width: 100%; max-width: 320px; padding: 24px; text-align: center;
}
.login-title { font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 4px; }
.login-sub { font-size: 11px; color: var(--sub); margin-bottom: 20px; }
.login-input {
  width: 100%; background: rgba(255,255,255,.05); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 13px; padding: 10px 12px;
  outline: none; margin-bottom: 12px;
}
.login-input:focus { border-color: var(--gold); }
.login-btn {
  width: 100%; background: var(--gold); color: #000; font-weight: 700; font-size: 13px;
  padding: 10px 0; border-radius: 8px; border: none; cursor: pointer; transition: .15s; margin-top: 4px;
}
.login-btn:hover { background: #E5B82E; }
#login-err { font-size: 11px; color: var(--red); margin-top: 10px; display: none; }

#topbar {
  position: absolute; top: 0; left: 0; right: 0; height: 54px;
  display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
  background: linear-gradient(180deg, rgba(7,14,26,.97) 60%, rgba(7,14,26,0));
  z-index: 500; gap: 8px;
}
.tb-brand { display: flex; flex-direction: column; min-width: 0; flex-shrink: 1; }
#tb-title { font-size: 12.5px; font-weight: 700; color: #F1F5F9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#tb-status { font-size: 9.5px; color: var(--sub); display: flex; align-items: center; gap: 5px; margin-top: 2px; }
.s-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; transition: background .3s; }

.tb-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
#search-wrap { position: relative; display: flex; align-items: center; }
#search {
  background: rgba(255,255,255,.06); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); font-size: 11.5px; padding: 6px 8px 6px 26px; outline: none; width: 120px;
}
#search::placeholder { color: var(--muted); }
.s-icon { position: absolute; left: 7px; color: var(--muted); font-size: 11px; pointer-events: none; }

.btn-geo {
  background: var(--gold-dim); border: 1px solid var(--gold-ring); color: var(--gold);
  font-size: 10.5px; font-weight: 600; padding: 5px 8px; border-radius: 8px; cursor: pointer;
  display: flex; align-items: center; gap: 4px; white-space: nowrap;
}
.btn-geo.hidden { display: none !important; }

.iBtn {
  width: 30px; height: 30px; background: rgba(255,255,255,.05); border: 1px solid var(--border);
  border-radius: 8px; color: var(--sub); cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0;
}

.panel {
  position: absolute; background: rgba(11,21,37,.96); backdrop-filter: blur(14px);
  border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow);
  z-index: 400; display: flex; flex-direction: column; overflow: hidden;
}
#p-layers { top: 62px; left: 12px; width: 270px; max-height: calc(100dvh - 78px); }
#p-kpis   { top: 62px; right: 12px; width: 310px; max-height: calc(100dvh - 78px); }
.p-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.p-title { font-size: 11.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.xBtn { width: 24px; height: 24px; border-radius: 6px; border: none; background: rgba(255,255,255,.05); color: var(--sub); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.p-body { overflow-y: auto; padding: 10px; flex: 1; }

.layer-group { margin-bottom: 8px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: rgba(255,255,255,.02); }
.layer-hdr { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; background: rgba(255,255,255,.04); cursor: pointer; font-size: 11px; font-weight: 700; color: var(--text); user-select: none; }
.layer-cnt { padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; max-height: 180px; overflow-y: auto; }
.layer-cnt.closed { display: none; }

.check-item { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--sub); cursor: pointer; padding: 3px 4px; border-radius: 5px; }
.check-item input[type="checkbox"] { accent-color: var(--gold); cursor: pointer; width: 14px; height: 14px; }
.check-item .lbl-txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.check-item .lbl-n { font-family: monospace; font-size: 10px; color: var(--muted); }
.check-item .lbl-mora { font-family: monospace; font-size: 10px; color: var(--red); font-weight: 700; }
.clear-btn { width: 100%; background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.2); color: #FCA5A5; font-size: 11px; cursor: pointer; padding: 6px; border-radius: 6px; text-align: center; margin-top: 6px; font-weight: 600; }

.kpi-ctx { margin-bottom: 9px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.kpi-fecha { font-size: 10.5px; font-weight: 700; color: #38BDF8; background: rgba(56,189,248,0.12); border: 1px solid rgba(56,189,248,0.25); padding: 3px 6px; border-radius: 5px; margin-top: 3px; display: inline-block; }
.kpi-lbl { font-size: 9px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

.kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.kcard { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06); border-radius: 8px; padding: 8px 9px; }
.kcard.full { grid-column: 1/-1; }
.kcard.split-card { grid-column: 1/-1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kcard.warn { background: rgba(239,68,68,.08); border-color: rgba(239,68,68,.25); }
.kcard .kk { font-size: 8.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 3px; }
.kcard .kv { font-family: monospace; font-size: 17px; font-weight: 700; color: #fff; line-height: 1.1; }
.kcard .kv.green { color: var(--green); font-size: 14.5px; }
.kcard .kv.blue  { color: var(--blue); font-size: 14.5px; }
.kcard .kv.red   { color: var(--red); font-size: 14.5px; }
.kcard .kv.sm    { font-size: 13.5px; }

.kdiv { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
.ktop-lbl { font-size: 9px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 6px; }
.top-row { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
.top-name { font-size: 10px; color: var(--sub); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-wrap { width: 50px; height: 5px; background: rgba(255,255,255,.07); border-radius: 3px; overflow: hidden; flex-shrink: 0; display: flex; }
.bar-green { height: 100%; background: var(--green); }
.bar-red   { height: 100%; background: var(--red); }
.top-n { font-family: monospace; font-size: 9px; color: var(--sub); width: 44px; text-align: right; flex-shrink: 0; }

.pop { padding: 12px 14px; min-width: 210px; max-width: 250px; }
.pop-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
.pop-id { font-family: monospace; font-size: 10.5px; font-weight: 800; color: var(--gold); background: var(--gold-dim); padding: 2px 6px; border-radius: 4px; }
.pop-emp { font-size: 9px; text-transform: uppercase; color: var(--sub); }
.pop-name { font-size: 13.5px; font-weight: 800; color: #1E293B; margin-bottom: 8px; line-height: 1.3; }
.pop-row { font-size: 11px; color: #64748B; margin-bottom: 3px; display: flex; justify-content: space-between; }
.pop-k { color: #94A3B8; font-size: 10px; }
.pop-v { font-weight: 700; color: #334155; text-align: right; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pop-saldo-block { margin-top: 8px; padding-top: 6px; border-top: 1px solid #E2E8F0; }
.pop-saldo-lbl { font-size: 9px; font-weight: 700; color: #94A3B8; text-transform: uppercase; }
.pop-saldo-green { font-family: monospace; font-size: 17px; font-weight: 800; color: #22C55E; margin-top: 1px; }
.pop-saldo-red   { font-family: monospace; font-size: 17px; font-weight: 800; color: #EF4444; margin-top: 1px; }
.pop-atraso-row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; background: rgba(239,68,68,0.1); padding: 4px 6px; border-radius: 4px; }
.pop-atraso-lbl { font-size: 9.5px; font-weight: 800; color: #DC2626; }
.pop-atraso-val { font-family: monospace; font-size: 12.5px; font-weight: 800; color: #DC2626; }
.pop-badge-mora { color: #DC2626; font-weight: 800; font-size: 10.5px; margin-top: 6px; background: #FEE2E2; padding: 5px; border-radius: 5px; text-align: center; }
.pop-badge-ok   { color: #16A34A; font-weight: 700; font-size: 10.5px; margin-top: 6px; background: #DCFCE7; padding: 5px; border-radius: 5px; text-align: center; }

#mobile-dock { display: none; position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 600; gap: 10px; background: rgba(11,21,37,.95); padding: 5px 8px; border-radius: 30px; border: 1px solid var(--border); backdrop-filter: blur(10px); }
.dock-btn { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); color: var(--text); padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; }
.dock-btn.active { background: var(--gold); color: #000; }

@media (max-width: 768px) {
  #mobile-dock { display: flex; }
  .panel { top: auto !important; left: 10px !important; right: 10px !important; bottom: 68px !important; width: auto !important; max-height: 65dvh !important; border-radius: 16px !important; }
  .panel.minimized-mobile { display: none !important; }
}
</style>
</head>
<body>

<!-- PANTALLA DE ACCESO / LOGIN -->
<div id="login-overlay">
  <div id="login-card">
    <div class="login-title">Acceso Ejecutivo</div>
    <div class="login-sub">Ingresa con tu usuario y contraseña</div>
    <form id="form-login" onsubmit="iniciarSesion(event)">
      <input class="login-input" type="text" id="login-user" placeholder="Usuario" autocomplete="username" required/>
      <input class="login-input" type="password" id="login-pass" placeholder="Contraseña" autocomplete="current-password" required/>
      <button class="login-btn" type="submit" id="btn-ingresar">Ingresar</button>
      <div id="login-err"></div>
    </form>
  </div>
</div>

<div id="map"></div>

<!-- TOPBAR -->
<div id="topbar">
  <div class="tb-brand">
    <div id="tb-title">MAPA DE CLIENTES · EJECUTIVO</div>
    <div id="tb-status"><span class="s-dot" id="s-dot" style="background:#4B5563"></span><span id="s-txt">Iniciando…</span></div>
  </div>
  <div class="tb-actions">
    <button class="btn-geo hidden" id="btn-geocodificar">
      <span>📍</span> <span id="geo-count">Geocodificar (0)</span>
    </button>
    <div id="search-wrap">
      <span class="s-icon">🔍</span>
      <input id="search" type="search" placeholder="Buscar..." autocomplete="off"/>
    </div>
    <button class="iBtn" id="btn-refresh" title="Actualizar datos">⟳</button>
    <button class="iBtn" id="btn-logout" title="Cerrar sesión" onclick="cerrarSesion()">🚪</button>
  </div>
</div>

<div id="mobile-dock">
  <button class="dock-btn" id="dock-layers">🗂 Filtros</button>
  <button class="dock-btn" id="dock-kpis">📊 KPIs</button>
</div>

<!-- PANEL CAPAS -->
<div class="panel" id="p-layers">
  <div class="p-header">
    <span class="p-title">🗂 Capas dinámicas</span>
    <button class="xBtn" id="close-layers">✕</button>
  </div>
  <div class="p-body" id="layers-body"></div>
</div>

<!-- PANEL KPIs -->
<div class="panel" id="p-kpis">
  <div class="p-header">
    <span class="p-title">📊 Totalizador ejecutivo</span>
    <button class="xBtn" id="close-kpis">✕</button>
  </div>
  <div class="p-body" id="kpis-body"></div>
</div>

<script>
const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbxSG4sQmtinjN2pvesuC9L85jxgTCXUsydgs-v_b1fz0KLAlsBtgWMYmfHP-o8DqECAJw/exec";

let CLIENTES = [];
let SESION_ACTIVA = null;
let FECHA_REPORTE = "Sin Fecha";

let filtrosSel = { estatus: [], empresa: [], region: [], territorio: [], agencia: [], asesor: [] };
let acordeonesState = { estatus: true, empresa: true, region: false, territorio: false, agencia: false, asesor: false };
let allMarkers = [];

const PALETA_EJECUTIVOS = ['#2DD4BF', '#38BDF8', '#818CF8', '#C084FC', '#F472B6', '#FB7185', '#F97316', '#FBBF24', '#A3E635', '#34D399'];
const colorEjecutivoMap = {};
function getColorEjecutivo(asesor){
  if(!asesor) return '#60A5FA';
  if(!colorEjecutivoMap[asesor]){
    colorEjecutivoMap[asesor] = PALETA_EJECUTIVOS[Object.keys(colorEjecutivoMap).length % PALETA_EJECUTIVOS.length];
  }
  return colorEjecutivoMap[asesor];
}

const fmt = n=>'$'+Number(n).toLocaleString('es-MX',{maximumFractionDigits:2, minimumFractionDigits:0});

// MAPA
const map = L.map('map',{zoomControl:true, preferCanvas:true}).setView([19.43,-99.14],9);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{
  attribution: 'Tiles &copy; Esri', maxZoom: 16
}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{
  maxZoom: 16
}).addTo(map);

const cluster = L.markerClusterGroup({
  chunkedLoading:true, maxClusterRadius:45, spiderfyOnMaxZoom:true, showCoverageOnHover:false,
  iconCreateFunction(c){
    const markers = c.getAllChildMarkers();
    const total = markers.length;
    const morosos = markers.filter(m => m.clienteData && m.clienteData.atraso === true).length;
    const tieneMora = morosos > 0;
    const sz = total > 100 ? 46 : total > 30 ? 40 : 36;
    const bg = tieneMora ? 'rgba(239, 68, 68, 0.92)' : 'rgba(201, 162, 39, 0.85)';
    const border = tieneMora ? '#7F1D1D' : 'rgba(255, 255, 255, 0.2)';

    return L.divIcon({
      html:`<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${bg};border:2px solid ${border};display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.6);">
        <span style="font-size:${total>99?10:12}px;line-height:1;">${total}</span>
        ${tieneMora ? `<span style="font-size:8px;opacity:0.95;margin-top:1px;">🔴 ${morosos}</span>` : ''}
      </div>`,
      className: '', iconSize: [sz, sz],
    });
  }
});
map.addLayer(cluster);

// AUTENTICACIÓN
async function iniciarSesion(event) {
  event.preventDefault();
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value.trim();
  const btn = document.getElementById('btn-ingresar');
  const err = document.getElementById('login-err');

  btn.textContent = "Verificando…";
  btn.disabled = true;
  err.style.display = "none";

  try {
    const r = await fetch(SHEET_API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: "login", usuario: u, password: p })
    });
    const j = await r.json();

    if (!j.ok) throw new Error(j.error || "Credenciales inválidas.");

    SESION_ACTIVA = { usuario: j.usuario, rol: j.rol, filtro: j.filtroAsignado };
    FECHA_REPORTE = j.fechaReporte;
    CLIENTES = j.clientes.map(c => ({
      ...c,
      id: Number(c.id),
      nombreCliente: c.cliente || c.nombre || c.nombre_cliente || c.razon_social || "CLIENTE S/N"
    }));

    document.getElementById('login-overlay').style.display = "none";
    document.getElementById('tb-title').textContent = `MAPA · ${j.rol.replace('_',' ')} (${j.filtroAsignado})`;
    document.getElementById('s-dot').style.background = "#22C55E";
    document.getElementById('s-txt').textContent = `${CLIENTES.length} clientes cargados`;

    reconstruirMarcadores();
    render(true);
  } catch (e) {
    err.textContent = e.message;
    err.style.display = "block";
  } finally {
    btn.textContent = "Ingresar";
    btn.disabled = false;
  }
}

function cerrarSesion() {
  SESION_ACTIVA = null;
  CLIENTES = [];
  cluster.clearLayers();
  document.getElementById('login-pass').value = '';
  document.getElementById('login-overlay').style.display = "flex";
}

function popHTML(c){
  const colEjec = getColorEjecutivo(c.asesor);
  const esMora = c.atraso === true;
  return`<div class="pop">
    <div class="pop-header-row"><span class="pop-emp">${c.empresa||'MCM'}</span><span class="pop-id">ID: #${c.id}</span></div>
    <div class="pop-name">${c.nombreCliente}</div>
    <div class="pop-row"><span class="pop-k">Agencia:</span><span class="pop-v">${c.agencia||'—'}</span></div>
    <div class="pop-row"><span class="pop-k">Asesor:</span><span class="pop-v" style="color:${colEjec}">${c.asesor||'—'}</span></div>
    <div class="pop-saldo-block">
      <div class="pop-saldo-lbl">Saldo Total:</div>
      <div class="${esMora ? 'pop-saldo-red' : 'pop-saldo-green'}">${fmt(c.saldo)}</div>
      ${esMora ? `
        <div class="pop-atraso-row"><span class="pop-atraso-lbl">VALOR ATRASO:</span><span class="pop-atraso-val">${fmt(c.montoAtraso)}</span></div>
        <div class="pop-badge-mora">🔴 EN MORA / ATRASO</div>
      ` : `<div class="pop-badge-ok">🟢 AL DÍA</div>`}
    </div>
  </div>`;
}

function reconstruirMarcadores(){
  cluster.clearLayers();
  allMarkers = CLIENTES.map(c=>{
    const esMora = c.atraso === true;
    const colorFinal = esMora ? '#EF4444' : getColorEjecutivo(c.asesor);
    const m = L.circleMarker([c.lat,c.lng],{
      radius: esMora ? 8.5 : 7, color: esMora ? '#7F1D1D' : '#070E1A', weight: esMora ? 2.5 : 1.5,
      fillColor: colorFinal, fillOpacity: 0.95, zIndexOffset: esMora ? 1000 : 0
    });
    m.bindPopup(popHTML(c),{maxWidth:260});
    m.clienteData = c;
    return m;
  });
}

function filtrados(q=''){
  const ql = q.toLowerCase().trim();
  return CLIENTES.filter(c => {
    if (filtrosSel.estatus.length) {
      if (filtrosSel.estatus.includes('mora') && !c.atraso) return false;
      if (filtrosSel.estatus.includes('aldia') && c.atraso) return false;
    }
    if (filtrosSel.empresa.length && !filtrosSel.empresa.includes(c.empresa)) return false;
    if (filtrosSel.region.length && !filtrosSel.region.includes(c.region)) return false;
    if (filtrosSel.territorio.length && !filtrosSel.territorio.includes(c.territorio)) return false;
    if (filtrosSel.agencia.length && !filtrosSel.agencia.includes(c.agencia)) return false;
    if (filtrosSel.asesor.length && !filtrosSel.asesor.includes(c.asesor)) return false;
    if (ql && !c.nombreCliente.toLowerCase().includes(ql) && !(c.asesor||'').toLowerCase().includes(ql) && !String(c.id).includes(ql)) return false;
    return true;
  });
}

function actualizarMapa(ajustar=false){
  const q = document.getElementById('search').value;
  const vis = filtrados(q);
  const ids = new Set(vis.map(c=>c.id));
  cluster.clearLayers();
  const mk = allMarkers.filter(m=>ids.has(m.clienteData.id));
  cluster.addLayers(mk);
  if(ajustar && mk.length){
    const g = L.featureGroup(mk);
    map.fitBounds(g.getBounds().pad(.2),{maxZoom:15,animate:true});
  }
}

function unicos(campo){
  const s = new Set();
  CLIENTES.forEach(c => {
    if (filtrosSel.estatus.length) {
      if (filtrosSel.estatus.includes('mora') && !c.atraso) return;
      if (filtrosSel.estatus.includes('aldia') && c.atraso) return;
    }
    if (campo !== 'empresa' && filtrosSel.empresa.length && !filtrosSel.empresa.includes(c.empresa)) return;
    if (campo !== 'region' && filtrosSel.region.length && !filtrosSel.region.includes(c.region)) return;
    if (campo !== 'territorio' && filtrosSel.territorio.length && !filtrosSel.territorio.includes(c.territorio)) return;
    if (campo !== 'agencia' && filtrosSel.agencia.length && !filtrosSel.agencia.includes(c.agencia)) return;
    if (c[campo]) s.add(c[campo]);
  });
  return [...s].sort((a,b)=>a.toString().localeCompare(b.toString(),'es'));
}

function cuentaConMora(campo, valor){
  let total = 0, morosos = 0;
  CLIENTES.forEach(c => {
    if (filtrosSel.estatus.length) {
      if (filtrosSel.estatus.includes('mora') && !c.atraso) return;
      if (filtrosSel.estatus.includes('aldia') && c.atraso) return;
    }
    if (campo !== 'empresa' && filtrosSel.empresa.length && !filtrosSel.empresa.includes(c.empresa)) return;
    if (campo !== 'region' && filtrosSel.region.length && !filtrosSel.region.includes(c.region)) return;
    if (campo !== 'territorio' && filtrosSel.territorio.length && !filtrosSel.territorio.includes(c.territorio)) return;
    if (campo !== 'agencia' && filtrosSel.agencia.length && !filtrosSel.agencia.includes(c.agencia)) return;
    if (c[campo] === valor) {
      total++;
      if (c.atraso === true) morosos++;
    }
  });
  return { total, morosos };
}

function renderFiltros(){
  const cont = document.getElementById('layers-body');
  cont.innerHTML = '';
  let haySeleccion = Object.values(filtrosSel).some(arr => arr.length > 0);

  const grpEst = document.createElement('div');
  grpEst.className = 'layer-group';
  grpEst.innerHTML = `
    <div class="layer-hdr" onclick="acordeonesState.estatus = !acordeonesState.estatus; renderFiltros();">
      <span>🚨 Estatus de Cartera ${filtrosSel.estatus.length ? `<b style="color:var(--gold);">(${filtrosSel.estatus.length})</b>`:''}</span>
      <span>${acordeonesState.estatus ? '▲' : '▼'}</span>
    </div>
    <div class="layer-cnt${acordeonesState.estatus ? '' : ' closed'}">
      <label class="check-item">
        <input type="checkbox" ${filtrosSel.estatus.includes('mora')?'checked':''} onchange="toggleEstatus('mora')"/>
        <span class="lbl-txt" style="color:#FCA5A5;font-weight:700;">🔴 Solo Clientes en Mora</span>
      </label>
      <label class="check-item">
        <input type="checkbox" ${filtrosSel.estatus.includes('aldia')?'checked':''} onchange="toggleEstatus('aldia')"/>
        <span class="lbl-txt" style="color:#A7F3D0;">🟢 Solo Clientes Al Día</span>
      </label>
    </div>
  `;
  cont.appendChild(grpEst);

  const CAPAS_CONFIG = [
    { campo: 'empresa',    label: 'Compañía',   icon: '🏢' },
    { campo: 'region',     label: 'Región',     icon: '🗺' },
    { campo: 'territorio', label: 'Territorio', icon: '📍' },
    { campo: 'agencia',    label: 'Agencia',    icon: '🏪' },
    { campo: 'asesor',     label: 'Ejecutivo',  icon: '👤' }
  ];

  CAPAS_CONFIG.forEach(capa => {
    // Si el usuario es Gerente de Agencia o Regional, ocultar niveles superiores redundantes
    if (SESION_ACTIVA && SESION_ACTIVA.rol === "GERENTE_AGENCIA" && ['empresa','region','agencia'].includes(capa.campo)) return;
    if (SESION_ACTIVA && SESION_ACTIVA.rol === "GERENTE_REGIONAL" && ['empresa','region'].includes(capa.campo)) return;

    const vals = unicos(capa.campo);
    if (!vals.length) return;

    const group = document.createElement('div');
    group.className = 'layer-group';
    const isOpen = acordeonesState[capa.campo];
    const nSel = filtrosSel[capa.campo].length;

    const hdr = document.createElement('div');
    hdr.className = 'layer-hdr';
    hdr.innerHTML = `<span>${capa.icon} ${capa.label} ${nSel > 0 ? `<b style="color:var(--gold);">(${nSel})</b>` : ''}</span><span>${isOpen ? '▲' : '▼'}</span>`;
    hdr.onclick = () => { acordeonesState[capa.campo] = !acordeonesState[capa.campo]; renderFiltros(); };

    const cnt = document.createElement('div');
    cnt.className = 'layer-cnt' + (isOpen ? '' : ' closed');

    vals.forEach(v => {
      const isChecked = filtrosSel[capa.campo].includes(v);
      const { total, morosos } = cuentaConMora(capa.campo, v);
      const colorTag = (capa.campo === 'asesor') ? getColorEjecutivo(v) : null;

      const lbl = document.createElement('label');
      lbl.className = 'check-item';
      lbl.innerHTML = `
        <input type="checkbox" ${isChecked ? 'checked' : ''}/>
        ${colorTag ? `<span style="background:${colorTag};width:8px;height:8px;border-radius:50%;flex-shrink:0;"></span>` : ''}
        <span class="lbl-txt" title="${v}">${v}</span>
        <span class="lbl-n">${total}</span>
        ${morosos > 0 ? `<span class="lbl-mora">(🔴${morosos})</span>` : ''}
      `;
      lbl.querySelector('input').onchange = (e) => {
        if (e.target.checked) filtrosSel[capa.campo].push(v);
        else filtrosSel[capa.campo] = filtrosSel[capa.campo].filter(x => x !== v);
        render(true);
      };
      cnt.appendChild(lbl);
    });

    group.appendChild(hdr);
    group.appendChild(cnt);
    cont.appendChild(group);
  });

  if (haySeleccion) {
    const cb = document.createElement('button');
    cb.className = 'clear-btn';
    cb.innerHTML = '✕ Limpiar todos los filtros';
    cb.onclick = () => {
      filtrosSel = { estatus: [], empresa: [], region: [], territorio: [], agencia: [], asesor: [] };
      render(true);
    };
    cont.appendChild(cb);
  }
}

function toggleEstatus(val) {
  if (filtrosSel.estatus.includes(val)) filtrosSel.estatus = filtrosSel.estatus.filter(x => x !== val);
  else filtrosSel.estatus.push(val);
  render(true);
}

function renderKPIs(){
  const q = document.getElementById('search').value;
  const datos = filtrados(q);
  
  const carteraTotal = datos.reduce((s,c) => s + (c.saldo || 0), 0);
  const pagareTotal  = datos.reduce((s,c) => s + (c.pagare || 0), 0);
  const atrasoTotal  = datos.reduce((s,c) => s + (c.montoAtraso || 0), 0);
  const prom = datos.length ? Math.round(carteraTotal / datos.length) : 0;
  const numMorosos = datos.filter(c => c.atraso).length;
  const pctClientesMora = datos.length ? (numMorosos / datos.length * 100).toFixed(1) : '0.0';
  const pctMoraFinanciera = carteraTotal > 0 ? (atrasoTotal / carteraTotal * 100).toFixed(1) : '0.0';

  const porEj = {};
  datos.forEach(c => {
    if (c.asesor) {
      if (!porEj[c.asesor]) porEj[c.asesor] = { total: 0, alDia: 0, morosos: 0 };
      porEj[c.asesor].total++;
      if (c.atraso === true) porEj[c.asesor].morosos++;
      else porEj[c.asesor].alDia++;
    }
  });

  const top = Object.entries(porEj).sort((a,b)=>b[1].total - a[1].total).slice(0,5);
  const maxTotal = top.length ? top[0][1].total : 1;

  document.getElementById('kpis-body').innerHTML = `
    <div class="kpi-ctx">
      <div class="kpi-lbl">Corte de Saldos (Celda X1)</div>
      <div class="kpi-fecha">📅 ${FECHA_REPORTE}</div>
    </div>
    <div class="kpi-grid">
      <div class="kcard"><div class="kk">Clientes</div><div class="kv">${datos.length}</div></div>
      <div class="kcard"><div class="kk">Ejecutivos</div><div class="kv">${Object.keys(porEj).length}</div></div>
      <div class="kcard split-card">
        <div><div class="kk">💰 Cartera Total</div><div class="kv green">${fmt(carteraTotal)}</div></div>
        <div style="border-left: 1px solid var(--border); padding-left: 8px;">
          <div class="kk">📜 Total Pagaré</div><div class="kv blue">${fmt(pagareTotal)}</div>
        </div>
      </div>
      <div class="kcard full warn"><div class="kk">🚨 Saldo Total Atraso (Col. L)</div><div class="kv red">${fmt(atrasoTotal)}</div></div>
      <div class="kcard"><div class="kk">Saldo Promedio</div><div class="kv sm">${fmt(prom)}</div></div>
      <div class="kcard warn"><div class="kk">% Mora Fin.</div><div class="kv red sm">${pctMoraFinanciera}%</div></div>
      <div class="kcard full${parseFloat(pctClientesMora)>0 ? ' warn':''}">
        <div class="kk">Clientes en Mora</div>
        <div class="kv${parseFloat(pctClientesMora)>0 ? ' red':''} sm">${numMorosos} <span style="font-size:9.5px;color:#94A3B8;">(${pctClientesMora}% vol)</span></div>
      </div>
    </div>
    <hr class="kdiv"/>
    <div class="ktop-lbl">Top ejecutivos en vista</div>
    ${top.map(([nombre, st]) => {
      const col = getColorEjecutivo(nombre);
      const pctWidth = (st.total / maxTotal) * 100;
      const pctGreen = (st.alDia / st.total) * 100;
      const pctRed   = (st.morosos / st.total) * 100;
      return `<div class="top-row">
        <span style="background:${col};width:8px;height:8px;border-radius:50%;flex-shrink:0;"></span>
        <span class="top-name">${nombre}</span>
        <div class="bar-wrap" style="width:${pctWidth * 0.5}px;">
          <div class="bar-green" style="width:${pctGreen}%;"></div>
          <div class="bar-red" style="width:${pctRed}%;"></div>
        </div>
        <span class="top-n">${st.total} <span style="color:#94A3B8;font-size:8px;">(${st.alDia}/${st.morosos})</span></span>
      </div>`;
    }).join('')}
  `;
}

function render(ajustar=false){
  renderFiltros();
  renderKPIs();
  actualizarMapa(ajustar);
}

// DOCK MÓVIL
const pLayers = document.getElementById('p-layers');
const pKpis   = document.getElementById('p-kpis');
const dockLayers = document.getElementById('dock-layers');
const dockKpis   = document.getElementById('dock-kpis');

function setupMobilePanels() {
  if (window.innerWidth <= 768) {
    pLayers.classList.add('minimized-mobile');
    pKpis.classList.add('minimized-mobile');
  } else {
    pLayers.classList.remove('minimized-mobile');
    pKpis.classList.remove('minimized-mobile');
  }
}

dockLayers.addEventListener('click', () => {
  const isHidden = pLayers.classList.contains('minimized-mobile');
  if (isHidden) {
    pLayers.classList.remove('minimized-mobile');
    pKpis.classList.add('minimized-mobile');
    dockLayers.classList.add('active');
    dockKpis.classList.remove('active');
  } else {
    pLayers.classList.add('minimized-mobile');
    dockLayers.classList.remove('active');
  }
});

dockKpis.addEventListener('click', () => {
  const isHidden = pKpis.classList.contains('minimized-mobile');
  if (isHidden) {
    pKpis.classList.remove('minimized-mobile');
    pLayers.classList.add('minimized-mobile');
    dockKpis.classList.add('active');
    dockLayers.classList.remove('active');
  } else {
    pKpis.classList.add('minimized-mobile');
    dockKpis.classList.remove('active');
  }
});

document.getElementById('close-layers').addEventListener('click', () => {
  pLayers.classList.add('minimized-mobile');
  dockLayers.classList.remove('active');
});

document.getElementById('close-kpis').addEventListener('click', () => {
  pKpis.classList.add('minimized-mobile');
  dockKpis.classList.remove('active');
});

window.addEventListener('resize', setupMobilePanels);
setupMobilePanels();

let st;
document.getElementById('search').addEventListener('input',()=>{
  clearTimeout(st); st = setTimeout(()=>render(false),220);
});

document.getElementById('btn-refresh').addEventListener('click', async ()=>{
  if (SESION_ACTIVA) {
    const btn = document.getElementById('btn-refresh');
    btn.classList.add('spinning');
    await iniciarSesion({ preventDefault: () => {} });
    setTimeout(() => btn.classList.remove('spinning'), 600);
  }
});
</script>
